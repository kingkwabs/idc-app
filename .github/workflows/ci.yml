name: Production checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - run: python idc-backend/scripts/check_repository_secrets.py --history

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idc-backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idc-backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1 bandit==1.9.4
      - run: python -m pytest -q tests
      - run: python -m compileall -q .
      - run: pip-audit -r requirements-runtime.txt
      - run: bandit -q -r . -x ./idc,./graphify-out,./tests,./test_quickbooks.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idc-operations-hub
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: idc-operations-hub/package-lock.json
      - run: npm ci
      - run: npm run build:check
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=moderate
