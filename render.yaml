services:
  - type: web
    name: idc-backend
    env: python
    rootDir: idc-backend
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DB_SECRET_NAME
        sync: false
      - key: DB_CLUSTER_ARN
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASS
        sync: false
